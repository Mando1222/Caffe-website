<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كافيه Mando</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>

<body>

    <header>
        <h1>مرحباً بكم في كافيه Mando</h1>
        <p>أفضل مكان للقهوة والأكلات الشهية</p>
    </header>

    <nav>
        <a href="#menu">القائمة</a>
        <a href="#cart">السلة</a>
        <a href="#contact">إرسال الطلب</a>
    </nav>

    <section id="menu">
        <h2>القائمة</h2>

        <h3>المشروبات</h3>
        <div class="menu-item" data-name="قهوة تركي" data-price="25">
            <span>قهوة تركي</span>
            <span>25 جنيه</span>
            <button class="add-to-cart">أضف</button>
        </div>
        <div class="menu-item" data-name="شاي" data-price="5">
            <span>شاي</span>
            <span>5 جنيه</span>
            <button class="add-to-cart">أضف</button>
        </div>
        <div class="menu-item" data-name="ناسكافيه" data-price="15">
            <span>ناسكافيه</span>
            <span>15 جنيه</span>
            <button class="add-to-cart">أضف</button>
        </div>

        <h3>الأكل</h3>
        <div class="menu-item" data-name="همبرجر" data-price="35">
            <span>همبرجر</span>
            <span>35 جنيه</span>
            <button class="add-to-cart">أضف</button>
        </div>
        <div class="menu-item" data-name="ساندويتش شاورما" data-price="20">
            <span>ساندويتش شاورما</span>
            <span>20 جنيه</span>
            <button class="add-to-cart">أضف</button>
        </div>
    </section>

    <section id="cart" class="cart">
        <h2>سلة الطلبات</h2>
        <div id="cart-items"></div>
        <p>الإجمالي: <span id="total">0</span> جنيه</p>
    </section>

    <section id="contact">
        <h2>إرسال الطلب</h2>

        <form id="order-form">
            <label>اسم العميل</label>
            <input type="text" id="name" required>

            <label>رقم الموبايل</label>
            <input type="tel" id="phone" placeholder="01xxxxxxxxx" required>

            <label>العنوان</label>
            <textarea id="location" required></textarea>

            <button type="button" id="share-location">📍 مشاركة الموقع</button>
            <button type="submit">إرسال الطلب واتساب</button>
        </form>
    </section>

    <footer>
        <p> كل الحقوق محفوظة © 2023 كافيه Mando </p>
    </footer>

</body>

</html>
